githubConfigUrl: "https://github.com/taylor-jt"  # org-level: serves every repo in the org the App is installed on

githubConfigSecret: gha-runner-secrets

minRunners: 0
maxRunners: 5

containerMode:
  type: "dind"

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"

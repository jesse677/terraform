githubConfigUrl: "https://github.com/OWNER/REPO"  # UPDATE THIS to the target repo

githubConfigSecret: gha-runner-secrets

minRunners: 0
maxRunners: 5

containerMode:
  type: "dind"

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
